name: Deploy Portfolio

on:
  push:
    branches: [ master, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Replace SMTP Password in appsettings.json
        uses: microsoft/variable-substitution@v1
        with:
          files: 'AdmirMuhicAPI/appsettings.json'
        env:
          SmtpSettings.Password: ${{ secrets.SMTP_PASSWORD }}

      - name: dotnet publish
        run: dotnet publish AdmirMuhicAPI/AdmirMuhicAPI.csproj -c Release -o ./deploy

      - name: Deploy site files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /wwwroot/
